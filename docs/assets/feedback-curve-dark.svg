<title>How a memory's rank moves</title>
<desc>Line chart of the boost recall adds to a memory's score against the times it was shown, from 0 to 50 shows, before decay, one uncredited show in 3 counting as a miss. One line per share of shows credited, with its value at 50 shows: never: it sinks to −0.01; 5 %: it sinks to −0.01; 10 % (neutral): it stays at 0; 25 %: it rises to +0.02; always: it rises to +0.06.</desc>
