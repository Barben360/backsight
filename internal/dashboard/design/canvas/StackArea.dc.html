<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Stacked area</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./tokens.css">
<link rel="stylesheet" href="./dashboard.css">
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div class="{{rootCls}}" data-theme="{{theme}}">
<figure class="chart">
  <div class="legend">
    <sc-for list="{{legend}}" as="k" hint-placeholder-count="3"><span><i class="sw {{k.f}}"></i>{{k.label}}</span></sc-for>
  </div>
  <svg viewBox="0 0 680 230" role="img" aria-label="New memories per day by kind, last 30 days">
    <sc-for list="{{yt}}" as="g" hint-placeholder-count="4">
      <line class="gl" x1="44" x2="672" y1="{{g.y}}" y2="{{g.y}}"></line>
      <text class="ta-e" x="38" y="{{g.ty}}">{{g.label}}</text>
    </sc-for>
    <sc-for list="{{areas}}" as="a" hint-placeholder-count="3">
      <path class="seg {{a.f}}" d="{{a.d}}"><title>{{a.t}}</title></path>
    </sc-for>
    <sc-for list="{{hits}}" as="h" hint-placeholder-count="30">
      <rect x="{{h.x}}" y="10" width="{{h.w}}" height="190" fill="transparent"><title>{{h.t}}</title></rect>
    </sc-for>
    <line class="bl" x1="44" x2="672" y1="200" y2="200"></line>
    <sc-for list="{{xt}}" as="x" hint-placeholder-count="5">
      <text class="ta-m" x="{{x.x}}" y="218">{{x.label}}</text>
    </sc-for>
  </svg>
  <details class="tblfb">
    <summary>Show as a table</summary>
    <table class="tbl">
      <thead><tr><th>Day</th><th class="r">summary</th><th class="r">fact about you and your work</th><th class="r">fact from a session</th></tr></thead>
      <tbody><sc-for list="{{rows}}" as="r" hint-placeholder-count="5"><tr><td>{{r.day}}</td><td class="r">{{r.a}}</td><td class="r">{{r.b}}</td><td class="r">{{r.c}}</td></tr></sc-for></tbody>
    </table>
  </details>
</figure>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark","inherit"],"default":"light"},"$preview":{"width":720,"height":340}}'>
class Component extends DCLogic {
  renderVals() {
    const theme = this.props.theme ?? 'light';
    const r = (i, s) => { const x = Math.sin((i + 1) * 12.9898 + s * 78.233) * 43758.5453; return x - Math.floor(x); };
    const N = 30, L = 44, R = 672, T = 10, B = 200;
    const kinds = [['summary', 'f-summary'], ['fact about you and your work', 'f-about'], ['fact from a session', 'f-session']];
    const v = [...Array(N)].map((_, i) => [Math.round(r(i, 1) * 3), Math.round(1 + r(i, 2) * 5), Math.round(2 + r(i, 3) * 7)]);
    const ymax = 20;
    const X = (i) => L + 4 + i * ((R - L - 8) / (N - 1));
    const Y = (k) => B - (k / ymax) * (B - T);
    const cum = v.map((d) => [d[0], d[0] + d[1], d[0] + d[1] + d[2]]);
    const areas = kinds.map((k, j) => {
      const top = cum.map((c, i) => X(i).toFixed(1) + ',' + Y(c[j]).toFixed(1));
      const bot = cum.map((c, i) => X(i).toFixed(1) + ',' + Y(j === 0 ? 0 : c[j - 1]).toFixed(1)).reverse();
      const total = v.reduce((a, d) => a + d[j], 0);
      return { f: k[1], d: 'M' + top.join(' L') + ' L' + bot.join(' L') + ' Z', t: k[0] + ': ' + total + ' new in 30 days' };
    }).reverse();
    const yt = [0, 5, 10, 15, 20].map((k) => ({ y: Y(k).toFixed(1), ty: (Y(k) + 4).toFixed(1), label: String(k) }));
    const step = (R - L - 8) / (N - 1);
    const day = (i) => (i < 30 ? 'Oct ' + (i + 1) : '');
    const hits = v.map((d, i) => ({ x: (X(i) - step / 2).toFixed(1), w: step.toFixed(1), t: day(i) + ': ' + d[0] + ' summaries, ' + d[1] + ' facts about you and your work, ' + d[2] + ' facts from a session' }));
    const xt = [2, 9, 16, 23, 29].map((i) => ({ x: X(i).toFixed(1), label: day(i) }));
    return {
      theme, rootCls: theme === 'inherit' ? 'dc-in' : 'page dc-solo pad', areas, yt, hits, xt,
      legend: kinds.map((k) => ({ f: k[1], label: k[0] })),
      rows: v.map((d, i) => ({ day: day(i), a: d[0], b: d[1], c: d[2] })).reverse().slice(0, 7),
    };
  }
}
</script>
</body>
</html>
