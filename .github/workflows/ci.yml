name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
# GitHub-hosted runners (decision 0068): each job has a machine of its own,
# so one slot serves them all. The Docker jobs take their Compose project
# from BACKSIGHT_CI_SLOT here and their ports from it in scripts/ports.sh,
# which fails on CI when it is unset rather than share slot 0 (the slots
# keep jobs apart on one machine, such as a maintainer's).
env:
  BACKSIGHT_CI_SLOT: "1"
jobs:
  test:
    runs-on: ubuntu-latest
    # About 26 minutes on main before the dashboard's page sweep moved
    # out of the -race run into its own (make test).
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.10" # go.mod's toolchain line (workflows_test.go)
          cache: true
      # install.sh's minisign path (TestInstallWithMinisign fails on CI
      # without minisign rather than skip).
      - run: scripts/ci-minisign.sh
      - run: make test
      # The license texts shipped with the binary cover the current go.mod.
      - run: scripts/third-party-licenses.sh --check
      # The Windows lock keeps the Linux lock's versions (offline compare of
      # the two committed locks; M7 block 2).
      - run: scripts/native-lock.sh --platform windows --check-shared
      # The testhooks build's own code (CI's update proof, the hook chaos
      # switch), never in a release.
      - run: make test-hooks
      # The metrics index's time budgets (first build, 15-minute catch-up).
      - run: make bench-index
      - run: make cross
  test-windows:
    # The unit tests on Windows (M7 block 2, decision 0080): the fakes are
    # the test binary itself (internal/testtool), the POSIX scripts' tests
    # skip. Nothing here needs admin; TestTaskStartStopForReal registers a
    # per-user scheduled task and removes it.
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.10" # go.mod's toolchain line (workflows_test.go)
          cache: true
      # internal/cli alone runs 9 to 10 minutes on the runner (each test
      # binary run is a process start, slow on Windows): go test's default
      # 10-minute bound per package would cut it.
      - run: go test ./... -count=1 -timeout 20m
        env:
          # The runner has a console logon: the server task runs there
          # (TestTaskStartStopForReal checks it came up through the task).
          BACKSIGHT_TEST_CONSOLE_LOGON: "1"
          # The time budgets' files on the runner's local disk (D:): its
          # C: flushes about 340 random 4 KiB writes a second, 30 times
          # fewer than D: or the Windows VM (testtool.BenchTempDir).
          BACKSIGHT_TEST_BENCH_DIR: ${{ runner.temp }}
  snapshot:
    # The release build, signed by minisign with a throwaway key: the
    # pre-publish key check passes, every signature verifies, and the Go
    # verifier accepts goreleaser's real output, the binary checking itself
    # included (decision 0067).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Built uncached, as the release is (release.yml, security review
      # M4): this job proves the release build, not a cache's.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.10" # go.mod's toolchain line (workflows_test.go)
          cache: false
      - run: scripts/ci-minisign.sh
      - name: Throwaway signing key
        run: minisign -G -W -p "$RUNNER_TEMP/test.pub" -s "$RUNNER_TEMP/test.key"
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.14.0
          args: release --snapshot --clean
        env:
          MINISIGN_KEY_FILE: ${{ runner.temp }}/test.key
      - run: make verify-dist PUBKEY="$RUNNER_TEMP/test.pub"
      - name: The Go verifier on goreleaser's output
        shell: bash # -eo pipefail: the tee below must not hide go test's status
        env:
          BACKSIGHT_TEST_DIST: ${{ github.workspace }}/dist
          BACKSIGHT_TEST_DIST_PUBKEY: ${{ runner.temp }}/test.pub
        run: |
          go test -count=1 -v -run 'TestGoreleaserDist|TestMinisignCLI|TestRealMinisignFixture' ./internal/signing/ ./internal/selfcheck/ | tee "$RUNNER_TEMP/go-test.log"
          for t in TestGoreleaserDist TestGoreleaserDistLicenses TestMinisignCLI; do grep -q -- "--- PASS: $t" "$RUNNER_TEMP/go-test.log" || { echo "::error::$t did not run"; exit 1; }; done
  lint:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.10" # go.mod's toolchain line (workflows_test.go)
          cache: true
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          # A hosted job has its machine to itself; on a machine running
          # several lints (one HOME and /tmp), each waits for golangci-lint's
          # lock instead of failing on it.
          args: --allow-parallel-runners
  sandbox:
    # The client against the pinned Hindsight with its mock LLM (SPEC §16).
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # A hosted runner's disk: its preinstalled toolchains leave too little
      # for the images, the model cache and the data (setup's doctor wants
      # 6 GB free).
      - name: Free the hosted runner's disk
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.10" # go.mod's toolchain line (workflows_test.go)
          cache: true
      # The server's model cache (scripts/hf-cache.sh), keyed on the
      # pinned image: its start does not depend on huggingface.co. A miss
      # only means the server downloads its models, and saves them.
      - name: The pinned Hindsight image (the model cache's key)
        id: pin
        run: |
          digest=$(sed -n 's/^const pinnedHindsight = ".*@\(sha256:[0-9a-f]\{64\}\)"$/\1/p' internal/server/render.go)
          [ -n "$digest" ] || { echo "::error::no pinnedHindsight digest in internal/server/render.go"; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: hf-cache
        with:
          path: ${{ runner.temp }}/hf-cache/hf_cache.tar
          key: hf-cache-${{ runner.os }}-${{ runner.arch }}-${{ steps.pin.outputs.digest }}
      - run: SANDBOX_PROJECT="bs-sandbox-${BACKSIGHT_CI_SLOT:?set it in the workflow env}" BACKSIGHT_HF_CACHE="$RUNNER_TEMP/hf-cache/hf_cache.tar" BACKSIGHT_HF_CACHE_DROP=1 scripts/sandbox.sh
      - name: Keep the model cache for the next runs
        id: hf-saved
        if: always() && steps.hf-cache.outputs.cache-hit != 'true'
        run: test -s "$RUNNER_TEMP/hf-cache/hf_cache.tar" && echo "saved=true" >> "$GITHUB_OUTPUT" || true
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: always() && steps.hf-saved.outputs.saved == 'true'
        with:
          path: ${{ runner.temp }}/hf-cache/hf_cache.tar
          key: ${{ steps.hf-cache.outputs.cache-primary-key }}
  fresh-install:
    # M4 block 4: setup from nothing (isolated HOME and Claude Code
    # profile), through verify, a stored memory found again, doctor, a
    # backup verified against the real Postgres, that backup restored
    # (M5 block 1: the session sent after it is re-sent once by jobs tick),
    # an update from an old to a new signed test build, server upgrade
    # included, after a failing migration and a failing server smoke each
    # rolled back (M5 block 2: scripts/update-chain.sh, with a throwaway
    # minisign key made in the run's own directory), and undo.
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      # A hosted runner's disk: its preinstalled toolchains leave too little
      # for the images, the model cache and the data (setup's doctor wants
      # 6 GB free).
      - name: Free the hosted runner's disk
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.10" # go.mod's toolchain line (workflows_test.go)
          cache: true
      # Node pinned for its npm: --allow-scripts needs npm 11 or newer
      # (Node 24.22.1 ships npm 11.19.1; the runner's own may be older).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
      - name: Claude Code, pinned, in the job's own prefix and HOME
        # npm 12 blocks install scripts by default and --allow-scripts lets
        # this one run (the postinstall fetches the native binary). It runs
        # with a HOME of its own, so nothing lands in the runner's (on a
        # maintainer's machine, their live Claude Code profile).
        run: |
          mkdir -p "$RUNNER_TEMP/npm-home"
          HOME="$RUNNER_TEMP/npm-home" npm install -g --prefix "$RUNNER_TEMP/npm" --allow-scripts=@anthropic-ai/claude-code @anthropic-ai/claude-code@2.1.310
          echo "$RUNNER_TEMP/npm/bin" >> "$GITHUB_PATH"
      - run: scripts/ci-minisign.sh
      # The server's model cache (scripts/hf-cache.sh), keyed on the
      # pinned image: its start does not depend on huggingface.co. A miss
      # only means the server downloads its models, and saves them.
      - name: The pinned Hindsight image (the model cache's key)
        id: pin
        run: |
          digest=$(sed -n 's/^const pinnedHindsight = ".*@\(sha256:[0-9a-f]\{64\}\)"$/\1/p' internal/server/render.go)
          [ -n "$digest" ] || { echo "::error::no pinnedHindsight digest in internal/server/render.go"; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: hf-cache
        with:
          path: ${{ runner.temp }}/hf-cache/hf_cache.tar
          key: hf-cache-${{ runner.os }}-${{ runner.arch }}-${{ steps.pin.outputs.digest }}
      - run: PROJECT="bs-fresh-${BACKSIGHT_CI_SLOT:?set it in the workflow env}" WORK="$RUNNER_TEMP" BACKSIGHT_HF_CACHE="$RUNNER_TEMP/hf-cache/hf_cache.tar" BACKSIGHT_HF_CACHE_DROP=1 scripts/fresh-install.sh
      - name: Keep the model cache for the next runs
        id: hf-saved
        if: always() && steps.hf-cache.outputs.cache-hit != 'true'
        run: test -s "$RUNNER_TEMP/hf-cache/hf_cache.tar" && echo "saved=true" >> "$GITHUB_OUTPUT" || true
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: always() && steps.hf-saved.outputs.saved == 'true'
        with:
          path: ${{ runner.temp }}/hf-cache/hf_cache.tar
          key: ${{ steps.hf-cache.outputs.cache-primary-key }}
  m6-chain:
    # M6 block 4 (decision 0073), on containers: the VM bench's dedup and
    # key-rotation proofs (scripts/m6-proofs.sh). One server on the runner's
    # private address, two client homes connected to it there with a
    # token; the checks of the bench run unchanged through a local driver.
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      # A hosted runner's disk: its preinstalled toolchains leave too little
      # for the images, the model cache and the data (setup's doctor wants
      # 6 GB free).
      - name: Free the hosted runner's disk
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.10" # go.mod's toolchain line (workflows_test.go)
          cache: true
      # Node pinned for its npm: --allow-scripts needs npm 11 or newer
      # (Node 24.22.1 ships npm 11.19.1; the runner's own may be older).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
      - name: Claude Code, pinned, in the job's own prefix and HOME
        # npm 12 blocks install scripts by default and --allow-scripts lets
        # this one run (the postinstall fetches the native binary). It runs
        # with a HOME of its own, so nothing lands in the runner's (on a
        # maintainer's machine, their live Claude Code profile).
        run: |
          mkdir -p "$RUNNER_TEMP/npm-home"
          HOME="$RUNNER_TEMP/npm-home" npm install -g --prefix "$RUNNER_TEMP/npm" --allow-scripts=@anthropic-ai/claude-code @anthropic-ai/claude-code@2.1.310
          echo "$RUNNER_TEMP/npm/bin" >> "$GITHUB_PATH"
      # The server's model cache (scripts/hf-cache.sh), keyed on the
      # pinned image: its start does not depend on huggingface.co. A miss
      # only means the server downloads its models, and saves them.
      - name: The pinned Hindsight image (the model cache's key)
        id: pin
        run: |
          digest=$(sed -n 's/^const pinnedHindsight = ".*@\(sha256:[0-9a-f]\{64\}\)"$/\1/p' internal/server/render.go)
          [ -n "$digest" ] || { echo "::error::no pinnedHindsight digest in internal/server/render.go"; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: hf-cache
        with:
          path: ${{ runner.temp }}/hf-cache/hf_cache.tar
          key: hf-cache-${{ runner.os }}-${{ runner.arch }}-${{ steps.pin.outputs.digest }}
      - run: PROJECT="bs-m6-chain-${BACKSIGHT_CI_SLOT:?set it in the workflow env}" WORK="$RUNNER_TEMP" BACKSIGHT_HF_CACHE="$RUNNER_TEMP/hf-cache/hf_cache.tar" BACKSIGHT_HF_CACHE_DROP=1 scripts/m6-chain.sh
      - name: Keep the model cache for the next runs
        id: hf-saved
        if: always() && steps.hf-cache.outputs.cache-hit != 'true'
        run: test -s "$RUNNER_TEMP/hf-cache/hf_cache.tar" && echo "saved=true" >> "$GITHUB_OUTPUT" || true
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: always() && steps.hf-saved.outputs.saved == 'true'
        with:
          path: ${{ runner.temp }}/hf-cache/hf_cache.tar
          key: ${{ steps.hf-cache.outputs.cache-primary-key }}
  native-chain:
    # M7 block 1 (decision 0078): the native runtime and the runtime switch
    # for real, on the runner user's own systemd user manager
    # (scripts/native-chain.sh): a native install from nothing, a round
    # trip to Docker and back gated on the data, the database unit's
    # refusals, a rolled-back upgrade and a rolled-back switch.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # A hosted runner's disk: native's Python, venvs and models beside
      # Docker's images, model cache and data.
      - name: Free the hosted runner's disk
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.10" # go.mod's toolchain line (workflows_test.go)
          cache: true
      # The units run under the runner user's systemd user manager, which
      # linger starts and keeps (setup refuses without it).
      - name: Linger for the runner user, its user manager answering
        run: |
          sudo loginctl enable-linger "$USER"
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          for _ in $(seq 1 30); do
            systemctl --user show-environment >/dev/null 2>&1 && exit 0
            sleep 1
          done
          echo "::error::the user manager of $USER never answered"
          exit 1
      # Setup wires Claude Code, as on Docker.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
      - name: Claude Code, pinned, in the job's own prefix and HOME
        run: |
          mkdir -p "$RUNNER_TEMP/npm-home"
          HOME="$RUNNER_TEMP/npm-home" npm install -g --prefix "$RUNNER_TEMP/npm" --allow-scripts=@anthropic-ai/claude-code @anthropic-ai/claude-code@2.1.310
          echo "$RUNNER_TEMP/npm/bin" >> "$GITHUB_PATH"
      # Two model caches. Docker's, as the Docker jobs key it (the pinned
      # image). Native's own: the Docker tar holds the reranker in its torch
      # form and lacks the embedding model, which the image ships; native
      # fetches both in onnx form, so it is keyed on the lock.
      - name: The model caches' keys
        id: pin
        run: |
          digest=$(sed -n 's/^const pinnedHindsight = ".*@\(sha256:[0-9a-f]\{64\}\)"$/\1/p' internal/server/render.go)
          [ -n "$digest" ] || { echo "::error::no pinnedHindsight digest in internal/server/render.go"; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "lock=$(sha256sum internal/server/nativelock/requirements-linux-amd64.txt | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: hf-cache
        with:
          path: ${{ runner.temp }}/hf-cache/hf_cache.tar
          key: hf-cache-${{ runner.os }}-${{ runner.arch }}-${{ steps.pin.outputs.digest }}
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: hf-native
        with:
          path: ${{ runner.temp }}/hf-native
          key: hf-native-${{ runner.os }}-${{ runner.arch }}-${{ steps.pin.outputs.lock }}
      - run: PROJECT="bs-native-chain-${BACKSIGHT_CI_SLOT:?set it in the workflow env}" WORK="$RUNNER_TEMP" BACKSIGHT_HF_CACHE="$RUNNER_TEMP/hf-cache/hf_cache.tar" BACKSIGHT_HF_CACHE_DROP=1 BACKSIGHT_NATIVE_HF="$RUNNER_TEMP/hf-native" scripts/native-chain.sh
      - name: Keep the model caches for the next runs
        id: hf-saved
        if: always()
        env:
          DOCKER_HIT: ${{ steps.hf-cache.outputs.cache-hit }}
          NATIVE_HIT: ${{ steps.hf-native.outputs.cache-hit }}
        run: |
          if [ "$DOCKER_HIT" != true ] && test -s "$RUNNER_TEMP/hf-cache/hf_cache.tar"; then echo "docker=true" >> "$GITHUB_OUTPUT"; fi
          if [ "$NATIVE_HIT" != true ] && test -f "$RUNNER_TEMP/hf-native/.backsight-models"; then echo "native=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: always() && steps.hf-saved.outputs.docker == 'true'
        with:
          path: ${{ runner.temp }}/hf-cache/hf_cache.tar
          key: ${{ steps.hf-cache.outputs.cache-primary-key }}
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: always() && steps.hf-saved.outputs.native == 'true'
        with:
          path: ${{ runner.temp }}/hf-native
          key: ${{ steps.hf-native.outputs.cache-primary-key }}
  native-chain-windows:
    # M7 block 2 (decision 0080): the native runtime end to end on Windows
    # (scripts/native-chain-windows.ps1): install.ps1 from a release signed
    # by a throwaway key, setup from nothing, store and recall, backup and
    # restore, a rolled-back upgrade, the supervisor's restart of a killed
    # postgres, a killed supervisor leaving nothing, the identity, stray
    # and fsync refusals, and uninstall leaving no task, process or data.
    # The runner's user is an admin with a console logon and the VC++
    # runtime in System32: the chain logs which start path came up and
    # checks that the server loads the runtime's app-local copies.
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.10" # go.mod's toolchain line (workflows_test.go)
          cache: true
      # Native's models, keyed on the Windows lock (as native-chain's
      # hf-native on the Linux one): a miss only means setup downloads them.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: hf-native
        with:
          path: ${{ runner.temp }}/hf-native
          key: hf-native-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('internal/server/nativelock/requirements-windows-amd64.txt') }}
      - name: The native chain
        shell: powershell
        env:
          BACKSIGHT_NATIVE_HF: ${{ runner.temp }}\hf-native
        run: |
          $env:PROJECT = "bs-native-chain-$env:BACKSIGHT_CI_SLOT"
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/native-chain-windows.ps1
      - name: Keep the model cache for the next runs
        id: hf-saved
        if: always()
        shell: bash
        env:
          NATIVE_HIT: ${{ steps.hf-native.outputs.cache-hit }}
        run: |
          if [ "$NATIVE_HIT" != true ] && test -f "$RUNNER_TEMP/hf-native/.backsight-models"; then echo "native=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: always() && steps.hf-saved.outputs.native == 'true'
        with:
          path: ${{ runner.temp }}/hf-native
          key: ${{ steps.hf-native.outputs.cache-primary-key }}
