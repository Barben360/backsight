name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
# Self-hosted: the backsight runners on the maintainer's machine. It keeps
# Go's caches, so setup-go's is off. Each runner's .env sets
# BACKSIGHT_CI_SLOT (1-3): the Docker jobs take their Compose project from
# it here and their ports from it in scripts/ports.sh (below the ephemeral
# range), apart from each other and from the machine's own install
# (project backsight, ports 18888 and 19999). A runner without it fails
# (scripts/ports.sh, and ${…:?} here) rather than share slot 0.
jobs:
  test:
    runs-on: [self-hosted, backsight]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: false
      - run: make test
      # The testhooks build's own code (CI's update proof), never in a release.
      - run: go test -count=1 -tags testhooks ./internal/migrate/
      - run: make cross
  snapshot:
    # The release build, signed by minisign with a throwaway key: the
    # pre-publish key check passes, every signature verifies, and the Go
    # verifier accepts goreleaser's real output, the binary checking itself
    # included (decision 0067).
    runs-on: [self-hosted, backsight]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: false
      - run: command -v minisign >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq minisign; }
      - name: Throwaway signing key
        run: minisign -G -W -p "$RUNNER_TEMP/test.pub" -s "$RUNNER_TEMP/test.key"
      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          distribution: goreleaser
          version: v2.14.0
          args: release --snapshot --clean
        env:
          MINISIGN_KEY_FILE: ${{ runner.temp }}/test.key
      - run: make verify-dist PUBKEY="$RUNNER_TEMP/test.pub"
      - name: The Go verifier on goreleaser's output
        shell: bash # -eo pipefail: the tee below must not hide go test's status
        env:
          BACKSIGHT_TEST_DIST: ${{ github.workspace }}/dist
          BACKSIGHT_TEST_DIST_PUBKEY: ${{ runner.temp }}/test.pub
        run: |
          go test -count=1 -v -run 'TestGoreleaserDist|TestMinisignCLI|TestRealMinisignFixture' ./internal/signing/ ./internal/selfcheck/ | tee "$RUNNER_TEMP/go-test.log"
          for t in TestGoreleaserDist TestMinisignCLI; do grep -q -- "--- PASS: $t" "$RUNNER_TEMP/go-test.log" || { echo "::error::$t did not run"; exit 1; }; done
  lint:
    runs-on: [self-hosted, backsight]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8.0.0
        with:
          version: v2.15.0
          # Runners on one machine share HOME and /tmp, so golangci-lint's
          # lock: run beside another job's lint instead of failing on it.
          args: --allow-parallel-runners
  sandbox:
    # The client against the pinned Hindsight with its mock LLM (SPEC §16).
    runs-on: [self-hosted, backsight]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: false
      - run: SANDBOX_PROJECT="bs-sandbox-${BACKSIGHT_CI_SLOT:?set it in the runner .env}" scripts/sandbox.sh
  fresh-install:
    # M4 block 4: setup from nothing (isolated HOME and Claude Code
    # profile), through verify, a stored memory found again, doctor, a
    # backup verified against the real Postgres, that backup restored
    # (M5 block 1: the session sent after it is re-sent once by jobs tick),
    # an update from an old to a new signed test build, server upgrade
    # included, after a failing migration and a failing server smoke each
    # rolled back (M5 block 2: scripts/update-chain.sh, with a throwaway
    # minisign key made in the run's own directory), and undo.
    runs-on: [self-hosted, backsight]
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Claude Code, pinned, in the job's own prefix and HOME (not the machine's)
        # npm 12 blocks install scripts by default; the postinstall fetches
        # the native binary. It runs with a HOME of its own: the runner's
        # is the machine's, with its live Claude Code profile.
        run: |
          mkdir -p "$RUNNER_TEMP/npm-home"
          HOME="$RUNNER_TEMP/npm-home" npm install -g --prefix "$RUNNER_TEMP/npm" --allow-scripts=@anthropic-ai/claude-code @anthropic-ai/claude-code@2.1.310
          echo "$RUNNER_TEMP/npm/bin" >> "$GITHUB_PATH"
      - run: command -v minisign >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq minisign; }
      - run: PROJECT="bs-fresh-${BACKSIGHT_CI_SLOT:?set it in the runner .env}" WORK="$RUNNER_TEMP" scripts/fresh-install.sh
