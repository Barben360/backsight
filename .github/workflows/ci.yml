name: diag
on:
  pull_request:
jobs:
  diag:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: flush-temp, run: "TestZZDiag(Random)?Flush", env: "BS_DIAG_FLUSH=1", dir: temp}
          - {name: flush-d, run: "TestZZDiag(Random)?Flush", env: "BS_DIAG_FLUSH=1", dir: d}
          - {name: default-temp, run: TestZZDiagFirstBuild, env: "BS_DIAG=1", dir: temp}
          - {name: default-d, run: TestZZDiagFirstBuild, env: "BS_DIAG=1", dir: d}
          - {name: syncoff-temp, run: TestZZDiagFirstBuild, env: "BS_DIAG=1 BS_DIAG_PRAGMA=_pragma=synchronous(OFF)", dir: temp}
          - {name: ckpt16k-cache-temp, run: TestZZDiagFirstBuild, env: "BS_DIAG=1 BS_DIAG_PRAGMA=_pragma=wal_autocheckpoint(16384)&_pragma=cache_size(-65536)", dir: temp}
          - {name: manual1-temp, run: TestZZDiagFirstBuild, env: "BS_DIAG=1 BS_DIAG_EVERY=1 BS_DIAG_PRAGMA=_pragma=wal_autocheckpoint(0)", dir: temp}
    name: ${{ matrix.name }}
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.10"
          cache: true
      - shell: bash
        run: |
          for kv in ${{ matrix.env }}; do export "$kv"; done
          export BS_DIAG_BUDGET=240s
          if [ "${{ matrix.dir }}" = d ]; then export BS_DIAG_DIR="$RUNNER_TEMP"; fi
          echo "TEMP=$TEMP RUNNER_TEMP=$RUNNER_TEMP"; wmic logicaldisk get caption,size,freespace 2>/dev/null || true
          go test ./internal/index -count=1 -v -timeout 15m -run '${{ matrix.run }}' 2>&1 | grep -v '^=== '
