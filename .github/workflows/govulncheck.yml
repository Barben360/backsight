name: govulncheck
# Known vulnerabilities our code reaches, in its modules or the Go
# standard library of go.mod's toolchain (security review M2). On every
# change, and weekly: a new advisory fails an unchanged tree, the sign to
# bump the toolchain line (go.mod and every setup-go step) or a module.
# Source mode only: binary mode on a stripped release binary reports every
# package of a module under a wildcard advisory (GO-2026-5932, x/crypto's
# openpgp, which backsight does not link), a failure nothing could fix.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
permissions:
  contents: read
# Not used by govulncheck; every workflow sets its runner slot
# (scripts/workflows_test.go).
env:
  BACKSIGHT_CI_SLOT: "1"
jobs:
  govulncheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.10" # go.mod's toolchain line (workflows_test.go)
          cache: false
      # A pinned version, fetched through the Go proxy and checked against
      # the checksum database. Exit status 3: a vulnerability is reachable.
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
