name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
# A tag pushed twice starts two runs seconds apart, and the second replaced
# the first's draft under its uploads (v0.1.5-m5): the newer run cancels
# the older one, and the guard below refuses a tag already published.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true
# GitHub-hosted runners (decision 0068); the tests need a runner slot on
# CI (scripts/ports.sh), and a hosted job has its machine to itself.
env:
  BACKSIGHT_CI_SLOT: "1"
jobs:
  release:
    timeout-minutes: 40
    runs-on: ubuntu-latest
    # The signing key is a secret of this environment, which only v* tags
    # may deploy to, with no reviewer (repository settings, not this file).
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # No cache (security review M4): setup-go's cache key is shared with
      # every main-branch CI job, some of which run third-party code (the
      # lint binary, Claude Code's npm package, containers), and a tag run
      # may restore the default branch's caches. go mod verify re-checks
      # the module cache, but compiled objects in GOCACHE are trusted on a
      # hit, so a poisoned cache would land in a signed binary. The release
      # builds from scratch: modules from the proxy, checked against go.sum.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.10" # go.mod's toolchain line (workflows_test.go)
          cache: false
      # Only the owner releases, with no manual approval: the tag ruleset
      # lets only admins create v* tags (repository settings), and this
      # refuses anyone else, a re-run included.
      - name: Refuse releases started by anyone but the owner
        run: |
          for a in "$GITHUB_ACTOR" "$GITHUB_TRIGGERING_ACTOR"; do
            [ "$a" = "$GITHUB_REPOSITORY_OWNER" ] || { echo "::error::$a is not $GITHUB_REPOSITORY_OWNER: only the owner releases"; exit 1; }
          done
      - name: Refuse tags that are not on main
        run: |
          git fetch -q origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::tag $GITHUB_REF_NAME is not on main"; exit 1; }
      # goreleaser replaces only a draft: a run reaching a published release
      # (the tag pushed again after its release) stops here.
      - name: Refuse tags already published
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          draft=$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft) || exit 0
          [ "$draft" = true ] || { echo "::error::$GITHUB_REF_NAME is already published: release a new tag"; exit 1; }
      # The release notes are hand-written (docs/releases/<tag>.md, read by
      # goreleaser below), and the tag has its row in docs/compatibility.md.
      - name: Refuse tags without their release notes
        run: |
          notes="docs/releases/$GITHUB_REF_NAME.md"
          [ -s "$notes" ] || { echo "::error::$notes is missing or empty: write the release notes first"; exit 1; }
          grep -qF "| $GITHUB_REF_NAME |" docs/compatibility.md || { echo "::error::docs/compatibility.md has no row for $GITHUB_REF_NAME"; exit 1; }
      - run: scripts/ci-minisign.sh
      - run: make test # the -race run, then the dashboard page sweep without it
      - name: Write the signing key
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          [ -n "$MINISIGN_SECRET_KEY" ] || { echo "::error::MINISIGN_SECRET_KEY is empty: set it in the release environment"; exit 1; }
          umask 077
          printf '%s\n' "$MINISIGN_SECRET_KEY" > "$RUNNER_TEMP/minisign.key"
      # A draft (.goreleaser.yaml): nobody sees the release before the
      # checks below pass on it.
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.14.0
          args: release --clean --release-notes docs/releases/${{ github.ref_name }}.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MINISIGN_KEY_FILE: ${{ runner.temp }}/minisign.key
      - name: Forget the signing key
        if: always()
        run: shred -u "$RUNNER_TEMP/minisign.key" || true
      - run: make verify-dist
      - name: The draft's assets are the signed ones
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ "$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = true ] || { echo "::error::$GITHUB_REF_NAME is not a draft"; exit 1; }
          draft=$RUNNER_TEMP/draft
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --dir "$draft"
          n=0
          for s in "$draft"/*.minisig; do minisign -VqH -p minisign.pub -m "${s%.minisig}"; n=$((n + 1)); done
          [ -e "$draft/checksums.txt.minisig" ] && [ "$n" -gt 1 ] || { echo "::error::the draft has $n signatures, checksums.txt's included?"; exit 1; }
          (cd "$draft" && sha256sum -c checksums.txt)
          echo "$n signatures and every checksum verified on the draft"
      - name: Publish the draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
