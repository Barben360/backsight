name: gitleaks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
  pull-requests: read   # gitleaks-action lists the PR commits; without it, PR scans fail with 403
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
