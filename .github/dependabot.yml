# Keeps the Go modules and the actions' SHA pins current (security review
# M2). Weekly, one grouped pull request per ecosystem; security updates
# (a repository setting) come as they are published. The cooldown leaves
# a new version a few days in the wild before it is proposed, the window
# in which a hijacked release is usually caught. Not covered here: go.mod's
# toolchain line and the setup-go go-version that matches it, the
# goreleaser and golangci-lint versions in the workflows, and the pinned
# Claude Code and Node versions; govulncheck's weekly run flags a Go
# release that fixes a reachable vulnerability.
#
# The native runtime's lock (internal/server/nativelock) is generated from
# the pinned Hindsight image's site-packages and must match it (0078): a
# bumped package there breaks that parity, so Dependabot ignores every
# package in it, security updates included. It moves only with the image
# pin, through scripts/native-lock.sh.
version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 5
    groups:
      gomod:
        patterns: ["*"]
    commit-message:
      prefix: "⬆️"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 5
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: "⬆️"
  - package-ecosystem: "pip"
    directory: "/internal/server/nativelock"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "*"
